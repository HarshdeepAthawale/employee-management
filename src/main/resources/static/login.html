<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmployeeHub — Sign in</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 32px;
      width: 360px;
      max-width: calc(100vw - 32px);
    }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .login-logo {
      width: 40px; height: 40px; background: var(--accent); color: #fff;
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
    }
    .login-title { font-weight: 700; font-size: 16px; }
    .login-subtitle { font-size: 12px; color: var(--text-muted); }
    .login-alert {
      display: none; padding: 10px 12px; border-radius: var(--radius);
      font-size: 13px; margin-bottom: 16px;
    }
    .login-alert.error { display: block; background: var(--danger-bg); color: #991b1b; }
    .login-alert.info { display: block; background: var(--success-bg); color: #065f46; }
    .login-hint { margin-top: 16px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
    .login-hint code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
    .btn-block { width: 100%; justify-content: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">EM</div>
      <div>
        <div class="login-title">EmployeeHub</div>
        <div class="login-subtitle">Sign in to continue</div>
      </div>
    </div>
    <div class="login-alert error" id="alert-error">Invalid username or password.</div>
    <div class="login-alert info" id="alert-logout">You have been signed out.</div>
    <form method="POST" action="/login" id="login-form">
      <input type="hidden" name="_csrf" id="csrf">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" name="username" id="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <div class="login-hint">
      Demo accounts — <code>admin/admin123</code> (ADMIN), <code>hr/hr123</code> (HR), <code>emp/emp123</code> (EMPLOYEE)
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has('error')) document.getElementById('alert-error').style.display = 'block';
    if (params.has('logout')) document.getElementById('alert-logout').style.display = 'block';
    function csrfToken() {
      const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : '';
    }
    document.getElementById('csrf').value = csrfToken();
    // If already logged in, go straight to the app
    fetch('/api/me').then(r => { if (r.ok) location.replace('/'); });
  </script>
</body>
</html>
